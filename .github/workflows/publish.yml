name: Publish to crates.io

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    environment:
      name: crates.io
      url: https://crates.io/crates/helr

    permissions:
      id-token: write # for trusted publishing to crates.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build with all features
        run: cargo build --all-features

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish helr
        run: |
          echo "::notice::Publishing helr (dry-run: ${DRY_RUN})"
          cargo publish ${DRY_RUN}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
